<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#05070a" />
<title>Landmark Distance — Lotte World Tower</title>
<style>
:root{color-scheme:dark;--glass:rgba(8,11,16,.64);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;color:#fff}
button,input{font:inherit}
#app,#stage{position:fixed;inset:0}
#stage{overflow:hidden;touch-action:none;user-select:none;background:#05070a}
#video,#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#111;transform-origin:50% 50%;will-change:transform}
#video.show,#photo.show{display:block}
#empty{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;background:radial-gradient(circle at 50% 35%,#172231 0,#090d13 44%,#05070a 100%)}
#empty.hidden{display:none}
#empty h1{margin:0 0 9px;font-size:25px;letter-spacing:-.045em}#empty p{margin:0;color:rgba(255,255,255,.58);font-size:13px;line-height:1.55}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.26),transparent 20%,transparent 74%,rgba(0,0,0,.28))}

/* intentionally tiny chrome: keep the camera view clear */
.topLeft{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:25;font-size:11px;font-weight:700;letter-spacing:.025em;text-shadow:0 1px 10px #000;pointer-events:none}
.topLeft span{display:block;margin-top:2px;font-size:9px;font-weight:500;color:rgba(255,255,255,.55)}
.gps{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:25;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25);backdrop-filter:blur(10px);font-size:9px;color:rgba(255,255,255,.66);pointer-events:none}

#result{position:absolute;top:calc(env(safe-area-inset-top) + 52px);left:50%;transform:translateX(-50%);z-index:24;display:none;min-width:112px;padding:7px 12px 8px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(10px);text-align:center;pointer-events:none;text-shadow:0 1px 10px #000}
#result.show{display:block}
#distance{font-size:31px;font-weight:780;line-height:1;letter-spacing:-.05em}#distance span{font-size:13px;margin-left:3px;font-weight:650;color:rgba(255,255,255,.78)}
#meta{margin-top:3px;font-size:9px;color:rgba(255,255,255,.52)}

#towerWrap{position:absolute;width:112px;height:520px;left:50%;top:44%;transform:translate(-50%,-50%) scale(.35);transform-origin:50% 50%;z-index:8;display:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.55));will-change:transform}
#towerWrap.show{display:block}
#towerVisible{position:absolute;inset:0;will-change:clip-path}
#towerVisible svg{width:100%;height:100%;overflow:visible}
.guide{fill:rgba(255,255,255,.018);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.cross{stroke:rgba(255,255,255,.6);stroke-width:1;vector-effect:non-scaling-stroke}

#occControls{position:absolute;inset:0;z-index:15;display:none;pointer-events:none}
#occControls.show{display:block}
#occBar{position:absolute;height:1px;background:rgba(255,255,255,.66);transform-origin:0 50%;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.occHandle{position:absolute;width:42px;height:42px;border:0;background:transparent;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;padding:0}
.occHandle::before{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.72);background:rgba(5,8,12,.56);backdrop-filter:blur(6px)}
.occHandle::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;transform:translate(-50%,-50%);border-radius:50%;background:#fff}

/* one compact toolbar only */
#toolbar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:7px;padding:7px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.2);box-shadow:0 10px 35px rgba(0,0,0,.28)}
.tool{width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10);color:#fff;font-size:15px;font-weight:700;padding:0}
.tool:active{transform:scale(.96)}
#cameraBtn{width:54px;height:54px;background:#fff;color:#090c10;font-size:18px}
#cameraBtn.on{box-shadow:0 0 0 3px rgba(66,220,120,.28)}
#zoomBtn{font-size:13px;font-variant-numeric:tabular-nums}
#fileInput{display:none}

/* calibration only appears on demand */
#sheetBackdrop{position:absolute;inset:0;z-index:48;background:rgba(0,0,0,.22);display:none}
#sheetBackdrop.show{display:block}
#sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:50;display:none;padding:14px 14px 12px;border-radius:24px;background:rgba(10,13,18,.92);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(26px);box-shadow:0 18px 60px rgba(0,0,0,.45)}
#sheet.show{display:block}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sheetHead strong{font-size:14px}.closeBtn{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:17px}
.control{display:grid;grid-template-columns:72px 1fr 46px;gap:8px;align-items:center;margin:11px 0;font-size:12px;color:rgba(255,255,255,.68)}
.control output{text-align:right;color:#fff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#fff}
.note{font-size:10px;line-height:1.45;color:rgba(255,255,255,.4);margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="선택한 사진" />
    <div id="empty"><div><h1>랜드마크 거리</h1><p>GPS 없이 롯데월드타워의 겉보기 크기로<br>거리를 추정하는 실험입니다.</p></div></div>
    <div id="shade"></div>
    <div class="topLeft">LANDMARK DISTANCE<span>LOTTE WORLD TOWER · 555 m</span></div>
    <div class="gps">GPS OFF</div>
    <div id="result"><div id="distance">—</div><div id="meta">1× · 실험용</div></div>

    <div id="towerWrap"><div id="towerVisible"><svg viewBox="0 0 112 520" xmlns="http://www.w3.org/2000/svg"><path class="guide" d="M56 4 C53 20 49 38 45 56 C41 77 38 101 35 128 C32 160 30 196 29 236 C28 278 28 318 27 352 C26 389 25 426 23 464 L20 512 L92 512 L89 464 C87 426 86 389 85 352 C84 318 84 278 83 236 C82 196 80 160 77 128 C74 101 71 77 67 56 C63 38 59 20 56 4 Z"/><line class="cross" x1="44" y1="4" x2="68" y2="4"/></svg></div></div>
    <div id="occControls"><div id="occBar"></div><button id="occLeft" class="occHandle" data-side="left" aria-label="왼쪽 가림 경계"></button><button id="occRight" class="occHandle" data-side="right" aria-label="오른쪽 가림 경계"></button></div>
  </div>

  <div id="toolbar">
    <button class="tool" id="photoBtn" aria-label="사진">▧</button>
    <button class="tool" id="zoomBtn" aria-label="확대">1×</button>
    <button class="tool" id="cameraBtn" aria-label="카메라">●</button>
    <button class="tool" id="resetBtn" aria-label="초기화">↺</button>
    <button class="tool" id="settingsBtn" aria-label="설정">⚙︎</button>
    <input id="fileInput" type="file" accept="image/*" capture="environment" />
  </div>

  <div id="sheetBackdrop"></div>
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheetHead"><strong>정확도 보정</strong><button class="closeBtn" id="closeSheet">×</button></div>
    <label class="control">세로 화각<input id="fov" type="range" min="35" max="75" step="0.5" value="50"><output id="fovOut">50°</output></label>
    <label class="control">가이드 크기<input id="scale" type="range" min="0.05" max="1.8" step="0.005" value="0.35"><output id="scaleOut">35%</output></label>
    <label class="control">가림 높이<input id="occ" type="range" min="0.18" max="0.96" step="0.005" value="0.62"><output id="occOut">62%</output></label>
    <div class="note">측정 중에는 이 패널을 닫아 두면 됩니다. 화면에서는 가이드와 가림선만 남습니다.</div>
  </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const stage=$('stage'),video=$('video'),photo=$('photo'),empty=$('empty'),tower=$('towerWrap'),towerVisible=$('towerVisible'),occControls=$('occControls'),occBar=$('occBar'),occLeft=$('occLeft'),occRight=$('occRight'),result=$('result'),distanceEl=$('distance'),meta=$('meta'),photoBtn=$('photoBtn'),zoomBtn=$('zoomBtn'),cameraBtn=$('cameraBtn'),resetBtn=$('resetBtn'),settingsBtn=$('settingsBtn'),fileInput=$('fileInput'),sheet=$('sheet'),sheetBackdrop=$('sheetBackdrop'),closeSheet=$('closeSheet'),fov=$('fov'),fovOut=$('fovOut'),scaleRange=$('scale'),scaleOut=$('scaleOut'),occRange=$('occ'),occOut=$('occOut');
const TOWER_HEIGHT_M=555,GUIDE_HEIGHT_PX=520,ZOOMS=[1,2,3,5];
let x=innerWidth/2,y=innerHeight*.44,scale=.35,occL=.62,occR=.62,zoom=1,stream=null,cameraTrack=null,nativeZoomCap=null,nativeZoomActive=false,activeOccSide=null,dragOffset=null,lastPinchDistance=0,lastPinchMid=null;
const pointers=new Map();
const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
const pd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
function mediaActive(active=true){empty.classList.toggle('hidden',active);tower.classList.toggle('show',active);occControls.classList.toggle('show',active);result.classList.toggle('show',active)}
function render(){tower.style.left=x+'px';tower.style.top=y+'px';tower.style.transform=`translate(-50%,-50%) scale(${scale})`;scaleRange.value=scale;scaleOut.value=Math.round(scale*100)+'%';fovOut.value=Number(fov.value).toFixed(Number(fov.value)%1?1:0)+'°';updateOcc();updateDistance()}
function updateDistance(){if(!tower.classList.contains('show'))return;const h=stage.clientHeight,vfov=Number(fov.value)*Math.PI/180,baseFocal=h/(2*Math.tan(vfov/2)),effectiveFocal=baseFocal*zoom,projected=GUIDE_HEIGHT_PX*scale,d=TOWER_HEIGHT_M*effectiveFocal/Math.max(projected,1);distanceEl.innerHTML=d>=1000?`${d/1000<10?(d/1000).toFixed(1):Math.round(d/1000)}<span>km</span>`:`${Math.round(d/10)*10}<span>m</span>`;meta.textContent=`${zoom}× · 실험용`}
function updateOcc(){const th=GUIDE_HEIGHT_PX*scale,top=y-th/2,half=Math.max(55,112*scale*.9),x1=x-half,x2=x+half,y1=top+th*occL,y2=top+th*occR;occLeft.style.left=x1+'px';occLeft.style.top=y1+'px';occRight.style.left=x2+'px';occRight.style.top=y2+'px';const dx=x2-x1,dy=y2-y1;occBar.style.left=x1+'px';occBar.style.top=y1+'px';occBar.style.width=Math.hypot(dx,dy)+'px';occBar.style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;towerVisible.style.clipPath=`polygon(0 0,100% 0,100% ${occR*100}%,0 ${occL*100}%)`;occRange.value=(occL+occR)/2;occOut.value=Math.round(((occL+occR)/2)*100)+'%'}
async function setZoom(z){zoom=z;nativeZoomActive=false;if(cameraTrack&&nativeZoomCap){const target=clamp(z,Math.max(1,nativeZoomCap.min||1),nativeZoomCap.max||z);try{await cameraTrack.applyConstraints({advanced:[{zoom:target}]});nativeZoomActive=true;zoom=target}catch(e){nativeZoomActive=false}}video.style.transform=nativeZoomActive?'scale(1)':`scale(${zoom})`;photo.style.transform=`scale(${zoom})`;zoomBtn.textContent=(Number.isInteger(zoom)?zoom:zoom.toFixed(1))+'×';updateDistance()}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error();if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();cameraTrack=stream.getVideoTracks()[0];nativeZoomCap=cameraTrack.getCapabilities?.().zoom?cameraTrack.getCapabilities().zoom:null;photo.classList.remove('show');video.classList.add('show');cameraBtn.classList.add('on');mediaActive(true);resetGuide()}catch(e){fileInput.click()}}
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;cameraTrack=null;nativeZoomCap=null;video.srcObject=null;video.classList.remove('show');cameraBtn.classList.remove('on')}
function resetGuide(){x=stage.clientWidth/2;y=stage.clientHeight*.44;scale=.35;occL=occR=.62;scaleRange.value=scale;occRange.value=.62;setZoom(1);render()}
function openSheet(){sheet.classList.add('show');sheetBackdrop.classList.add('show')}function hideSheet(){sheet.classList.remove('show');sheetBackdrop.classList.remove('show')}
cameraBtn.addEventListener('click',()=>{if(stream)stopCamera();else startCamera()});
photoBtn.addEventListener('click',()=>fileInput.click());resetBtn.addEventListener('click',resetGuide);settingsBtn.addEventListener('click',openSheet);closeSheet.addEventListener('click',hideSheet);sheetBackdrop.addEventListener('click',hideSheet);
zoomBtn.addEventListener('click',()=>{const i=ZOOMS.indexOf(Number(zoom));setZoom(ZOOMS[(i+1+ZOOMS.length)%ZOOMS.length])});
fileInput.addEventListener('change',()=>{const file=fileInput.files?.[0];if(!file)return;stopCamera();const url=URL.createObjectURL(file);photo.onload=()=>URL.revokeObjectURL(url);photo.src=url;photo.classList.add('show');mediaActive(true);resetGuide()});
fov.addEventListener('input',render);scaleRange.addEventListener('input',()=>{scale=Number(scaleRange.value);render()});occRange.addEventListener('input',()=>{occL=occR=Number(occRange.value);render()});
function beginOcc(e){e.preventDefault();e.stopPropagation();activeOccSide=e.currentTarget.dataset.side;e.currentTarget.setPointerCapture?.(e.pointerId)}occLeft.addEventListener('pointerdown',beginOcc);occRight.addEventListener('pointerdown',beginOcc);
window.addEventListener('pointermove',e=>{if(!activeOccSide)return;const th=GUIDE_HEIGHT_PX*scale,top=y-th/2,r=clamp((e.clientY-top)/th,.18,.96);if(activeOccSide==='left')occL=r;else occR=r;render()},{passive:false});window.addEventListener('pointerup',()=>activeOccSide=null);window.addEventListener('pointercancel',()=>activeOccSide=null);
stage.addEventListener('pointerdown',e=>{if(!tower.classList.contains('show')||e.target.closest?.('.occHandle'))return;stage.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)dragOffset={x:e.clientX-x,y:e.clientY-y};else if(pointers.size===2){const[a,b]=[...pointers.values()];lastPinchDistance=pd(a,b);lastPinchMid=mid(a,b);dragOffset=null}});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||activeOccSide)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragOffset){x=e.clientX-dragOffset.x;y=e.clientY-dragOffset.y;render()}else if(pointers.size===2){const[a,b]=[...pointers.values()],d=pd(a,b),m=mid(a,b);if(lastPinchDistance>0)scale=clamp(scale*(d/lastPinchDistance),.05,1.8);if(lastPinchMid){x+=m.x-lastPinchMid.x;y+=m.y-lastPinchMid.y}lastPinchDistance=d;lastPinchMid=m;render()}});
function endPointer(e){pointers.delete(e.pointerId);if(!pointers.size){dragOffset=null;lastPinchDistance=0;lastPinchMid=null}else if(pointers.size===1){const p=[...pointers.values()][0];dragOffset={x:p.x-x,y:p.y-y};lastPinchDistance=0;lastPinchMid=null}}stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);
window.addEventListener('resize',()=>{x=clamp(x,0,stage.clientWidth);y=clamp(y,0,stage.clientHeight);render()});
render();
})();
</script>
</body>
</html>
