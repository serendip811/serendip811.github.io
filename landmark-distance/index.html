<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#05070a" />
<title>Landmark Distance — Lotte World Tower</title>
<style>
  :root{color-scheme:dark;--panel:rgba(8,12,18,.78);--line:rgba(255,255,255,.22);--muted:rgba(255,255,255,.62)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;color:#fff}
  button,input{font:inherit}
  #app{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#182333 0,#090d13 42%,#05070a 100%)}
  #stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none}
  #video,#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#111}
  #photo.show,#video.show{display:block}
  #shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.38),transparent 22%,transparent 60%,rgba(0,0,0,.64))}
  .topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .brand{font-weight:700;letter-spacing:-.03em;font-size:17px;text-shadow:0 1px 12px #000}
  .brand small{display:block;margin-top:3px;font-size:11px;font-weight:500;color:rgba(255,255,255,.65);letter-spacing:.02em}
  .badge{padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(12px);font-size:11px;color:rgba(255,255,255,.72)}
  #empty{position:absolute;inset:0;display:grid;place-items:center;padding:36px;text-align:center;z-index:2}
  #empty.hidden{display:none}
  .emptyCard{max-width:330px;margin-top:-60px}
  .icon{width:74px;height:74px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:31px;box-shadow:0 18px 55px rgba(0,0,0,.3)}
  .emptyCard h1{font-size:27px;line-height:1.08;margin:0 0 10px;letter-spacing:-.045em}
  .emptyCard p{font-size:14px;line-height:1.55;margin:0;color:rgba(255,255,255,.6)}
  #towerWrap{position:absolute;width:112px;height:520px;left:50%;top:43%;transform:translate(-50%,-50%) scale(.35);transform-origin:50% 50%;z-index:5;display:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,.65));will-change:transform}
  #towerWrap.show{display:block}
  #towerWrap svg{width:100%;height:100%;overflow:visible}
  .guideSolid{fill:rgba(255,255,255,.055);stroke:#fff;stroke-width:2.4;vector-effect:non-scaling-stroke}
  .guideHidden{fill:none;stroke:rgba(255,255,255,.42);stroke-width:1.7;stroke-dasharray:7 8;vector-effect:non-scaling-stroke}
  .cross{stroke:rgba(255,255,255,.5);stroke-width:1.2;vector-effect:non-scaling-stroke}
  #hint{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:8;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);border-radius:999px;padding:8px 12px;font-size:12px;color:rgba(255,255,255,.82);white-space:nowrap;display:none;pointer-events:none}
  #hint.show{display:block}
  #result{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 136px);z-index:9;display:none;align-items:flex-end;justify-content:space-between;pointer-events:none;text-shadow:0 2px 14px #000}
  #result.show{display:flex}
  .distanceLabel{font-size:12px;color:rgba(255,255,255,.66);margin-bottom:3px}
  #distance{font-size:42px;font-weight:750;letter-spacing:-.055em;line-height:1}
  #distance span{font-size:18px;font-weight:650;letter-spacing:-.02em;margin-left:3px;color:rgba(255,255,255,.78)}
  #accuracy{font-size:11px;color:rgba(255,255,255,.58);text-align:right;line-height:1.4}
  .panel{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:10px;backdrop-filter:blur(24px) saturate(1.25);box-shadow:0 18px 55px rgba(0,0,0,.35)}
  .row{display:flex;gap:8px;align-items:center}
  .btn{height:48px;border:0;border-radius:16px;padding:0 16px;background:rgba(255,255,255,.1);color:#fff;font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.primary{flex:1;background:#fff;color:#0b0d10}
  .btn.iconBtn{width:48px;padding:0;font-size:18px}
  #fileInput{display:none}
  details{margin-top:8px;border-top:1px solid rgba(255,255,255,.09);padding:8px 8px 0}
  summary{list-style:none;font-size:12px;color:rgba(255,255,255,.58);cursor:pointer;padding:2px 0 5px}
  summary::-webkit-details-marker{display:none}
  .control{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;margin:8px 0;font-size:12px;color:rgba(255,255,255,.68)}
  .control output{text-align:right;color:rgba(255,255,255,.88);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:#fff}
  .note{font-size:10.5px;line-height:1.45;color:rgba(255,255,255,.42);padding:3px 0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="선택한 사진" />
    <div id="empty">
      <div class="emptyCard">
        <div class="icon">⌁</div>
        <h1>랜드마크까지<br>얼마나 멀까?</h1>
        <p>GPS 없이, 화면에 보이는 롯데월드타워의 크기로 거리를 추정하는 실험입니다.</p>
      </div>
    </div>
    <div id="shade"></div>
    <div class="topbar">
      <div class="brand">LANDMARK DISTANCE<small>LOTTE WORLD TOWER · 555 m</small></div>
      <div class="badge">GPS OFF</div>
    </div>
    <div id="hint">한 손가락으로 이동 · 두 손가락으로 크기 조절</div>
    <div id="towerWrap" aria-label="롯데월드타워 맞춤 가이드">
      <svg viewBox="0 0 112 520" xmlns="http://www.w3.org/2000/svg">
        <path class="guideSolid" d="M56 4 C53 20 49 38 45 56 C41 77 38 101 35 128 C32 160 30 196 29 236 C28 278 28 318 27 352 L85 352 C84 318 84 278 83 236 C82 196 80 160 77 128 C74 101 71 77 67 56 C63 38 59 20 56 4 Z"/>
        <path class="guideHidden" d="M27 352 C26 389 25 426 23 464 L20 512 M85 352 C86 389 87 426 89 464 L92 512 M20 512 L92 512"/>
        <line class="cross" x1="44" y1="4" x2="68" y2="4" />
        <line class="cross" x1="16" y1="352" x2="96" y2="352" />
      </svg>
    </div>
    <div id="result">
      <div><div class="distanceLabel">롯데월드타워까지 약</div><div id="distance">—</div></div>
      <div id="accuracy">1× 카메라 가정<br>실험용 추정치</div>
    </div>
  </div>
  <div class="panel">
    <div class="row">
      <button class="btn primary" id="cameraBtn">카메라 시작</button>
      <button class="btn" id="photoBtn">사진</button>
      <button class="btn iconBtn" id="resetBtn" aria-label="가이드 초기화">↺</button>
      <input id="fileInput" type="file" accept="image/*" capture="environment" />
    </div>
    <details>
      <summary>정확도 보정 ▾</summary>
      <label class="control">세로 화각<input id="fov" type="range" min="35" max="75" step="0.5" value="50"><output id="fovOut">50°</output></label>
      <label class="control">가이드 크기<input id="scale" type="range" min="0.05" max="1.8" step="0.005" value="0.35"><output id="scaleOut">35%</output></label>
      <label class="control">기울기<input id="rotation" type="range" min="-15" max="15" step="0.5" value="0"><output id="rotationOut">0°</output></label>
      <div class="note">현재 버전은 개념 검증용입니다. 실제 제품에서는 기종·렌즈별 화각 보정과 정확한 타워 외형 모델이 필요합니다.</div>
    </details>
  </div>
</div>
<script>
(() => {
  const stage = document.getElementById('stage'), video = document.getElementById('video'), photo = document.getElementById('photo'), empty = document.getElementById('empty'), tower = document.getElementById('towerWrap'), hint = document.getElementById('hint'), result = document.getElementById('result'), distanceEl = document.getElementById('distance'), cameraBtn = document.getElementById('cameraBtn'), photoBtn = document.getElementById('photoBtn'), resetBtn = document.getElementById('resetBtn'), fileInput = document.getElementById('fileInput'), fov = document.getElementById('fov'), fovOut = document.getElementById('fovOut'), scaleRange = document.getElementById('scale'), scaleOut = document.getElementById('scaleOut'), rotation = document.getElementById('rotation'), rotationOut = document.getElementById('rotationOut');
  const TOWER_HEIGHT_M = 555, GUIDE_HEIGHT_PX = 520;
  let x = innerWidth / 2, y = innerHeight * .43, scale = .35, angle = 0, stream = null, lastPinchDistance = 0, lastPinchMid = null, dragOffset = null;
  const pointers = new Map();
  function setMediaActive(active = true) { empty.classList.toggle('hidden', active); tower.classList.toggle('show', active); hint.classList.toggle('show', active); result.classList.toggle('show', active); if (active) setTimeout(() => hint.classList.remove('show'), 3300); }
  function resetGuide() { x = stage.clientWidth / 2; y = stage.clientHeight * .43; scale = .35; angle = 0; scaleRange.value = scale; rotation.value = angle; render(); }
  function render() { tower.style.left = x + 'px'; tower.style.top = y + 'px'; tower.style.transform = `translate(-50%,-50%) scale(${scale}) rotate(${angle}deg)`; scaleRange.value = scale; scaleOut.value = Math.round(scale * 100) + '%'; rotationOut.value = Number(angle).toFixed(angle % 1 ? 1 : 0) + '°'; fovOut.value = Number(fov.value).toFixed(fov.value % 1 ? 1 : 0) + '°'; updateDistance(); }
  function updateDistance() { if (!tower.classList.contains('show')) return; const h = stage.clientHeight, vfovRad = Number(fov.value) * Math.PI / 180, focalPx = h / (2 * Math.tan(vfovRad / 2)), projectedTowerHeight = GUIDE_HEIGHT_PX * scale, distanceM = TOWER_HEIGHT_M * focalPx / Math.max(1, projectedTowerHeight); if (distanceM >= 1000) { const km = distanceM / 1000; distanceEl.innerHTML = `${km < 10 ? km.toFixed(1) : Math.round(km)}<span>km</span>`; } else distanceEl.innerHTML = `${Math.round(distanceM / 10) * 10}<span>m</span>`; }
  async function startCamera() { try { if (!navigator.mediaDevices?.getUserMedia) throw new Error('camera unsupported'); if (stream) stream.getTracks().forEach(t => t.stop()); stream = await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}}); video.srcObject = stream; await video.play(); photo.classList.remove('show'); video.classList.add('show'); setMediaActive(true); cameraBtn.textContent = '카메라 켜짐'; resetGuide(); } catch (e) { fileInput.click(); } }
  function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } video.srcObject = null; video.classList.remove('show'); cameraBtn.textContent = '카메라 시작'; }
  cameraBtn.addEventListener('click', startCamera); photoBtn.addEventListener('click', () => fileInput.click()); resetBtn.addEventListener('click', resetGuide);
  fileInput.addEventListener('change', () => { const file = fileInput.files?.[0]; if (!file) return; stopCamera(); const url = URL.createObjectURL(file); photo.onload = () => URL.revokeObjectURL(url); photo.src = url; photo.classList.add('show'); setMediaActive(true); resetGuide(); });
  fov.addEventListener('input', render); scaleRange.addEventListener('input', () => { scale = Number(scaleRange.value); render(); }); rotation.addEventListener('input', () => { angle = Number(rotation.value); render(); });
  const pointDistance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y), midpoint = (a,b) => ({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  stage.addEventListener('pointerdown', e => { if (!tower.classList.contains('show')) return; stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if (pointers.size===1) dragOffset={x:e.clientX-x,y:e.clientY-y}; else if (pointers.size===2) { const [a,b]=[...pointers.values()]; lastPinchDistance=pointDistance(a,b); lastPinchMid=midpoint(a,b); dragOffset=null; } });
  stage.addEventListener('pointermove', e => { if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if (pointers.size===1 && dragOffset) { x=e.clientX-dragOffset.x; y=e.clientY-dragOffset.y; render(); } else if (pointers.size===2) { const [a,b]=[...pointers.values()], d=pointDistance(a,b), mid=midpoint(a,b); if (lastPinchDistance>0) scale*=d/lastPinchDistance; scale=Math.min(1.8,Math.max(.05,scale)); if (lastPinchMid) { x+=mid.x-lastPinchMid.x; y+=mid.y-lastPinchMid.y; } lastPinchDistance=d; lastPinchMid=mid; render(); } });
  function endPointer(e) { pointers.delete(e.pointerId); if (pointers.size===1) { const p=[...pointers.values()][0]; dragOffset={x:p.x-x,y:p.y-y}; } else { lastPinchDistance=0; lastPinchMid=null; dragOffset=null; } }
  stage.addEventListener('pointerup',endPointer); stage.addEventListener('pointercancel',endPointer); window.addEventListener('resize',()=>{x=Math.min(stage.clientWidth,Math.max(0,x));y=Math.min(stage.clientHeight,Math.max(0,y));render();}); render();
})();
</script>
</body>
</html>
