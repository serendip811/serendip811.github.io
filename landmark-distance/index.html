<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>Landmark Distance</title>
<style>
:root{color-scheme:dark;--panel:rgba(7,10,15,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
button,input{font:inherit} #app,#stage{position:fixed;inset:0} #stage{overflow:hidden;touch-action:none;background:#080b10}
#video,#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none} #video.show,#photo.show{display:block}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:35px;background:radial-gradient(circle at 50% 35%,#192334,#080b10 55%)} #empty.hidden{display:none}
#empty h1{font-size:28px;line-height:1.08;margin:0 0 12px} #empty p{margin:0;color:#9da4af;font-size:14px;line-height:1.55}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.42),transparent 25%,transparent 65%,rgba(0,0,0,.55))}
.top{position:absolute;z-index:15;left:18px;right:18px;top:calc(env(safe-area-inset-top) + 14px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 10px #000}
.brand{font-size:17px;font-weight:750;letter-spacing:-.03em}.brand small{display:block;font-size:11px;font-weight:500;color:#c0c4cc;margin-top:3px;letter-spacing:.04em}.badge{font-size:11px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18)}
#result{position:absolute;z-index:30;top:calc(env(safe-area-inset-top) + 82px);left:50%;transform:translateX(-50%);display:none;min-width:180px;text-align:center;padding:10px 16px 11px;border-radius:20px;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px);pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#result.show{display:block}.distanceLabel{font-size:11px;color:rgba(255,255,255,.68);margin-bottom:2px}#distance{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}#distance span{font-size:16px;font-weight:650;margin-left:3px;color:#ddd}
#towerWrap{position:absolute;width:112px;height:520px;left:50%;top:43%;transform-origin:50% 50%;z-index:8;display:none;filter:drop-shadow(0 3px 12px #000);will-change:transform}#towerWrap.show{display:block}#towerWrap svg{width:100%;height:100%;overflow:visible}.solid{fill:rgba(255,255,255,.055);stroke:#fff;stroke-width:2.4;vector-effect:non-scaling-stroke}.hidden{fill:none;stroke:rgba(255,255,255,.42);stroke-width:1.7;stroke-dasharray:7 8;vector-effect:non-scaling-stroke}.cross{stroke:rgba(255,255,255,.55);stroke-width:1.2;vector-effect:non-scaling-stroke}
#hint{position:absolute;z-index:16;left:50%;top:calc(env(safe-area-inset-top) + 145px);transform:translateX(-50%);display:none;white-space:nowrap;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.5);font-size:11px;color:#ddd;pointer-events:none}#hint.show{display:block}
.panel{position:absolute;z-index:25;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);padding:10px;background:var(--panel);border:1px solid rgba(255,255,255,.13);border-radius:24px;backdrop-filter:blur(24px);box-shadow:0 18px 55px rgba(0,0,0,.4)}.row{display:flex;gap:8px}.btn{height:48px;border:0;border-radius:16px;padding:0 16px;background:rgba(255,255,255,.11);color:#fff;font-weight:650}.btn.primary{flex:1;background:#fff;color:#101216}.btn.icon{width:48px;padding:0;font-size:19px}#fileInput{display:none}
details{margin-top:8px;padding:8px 8px 0;border-top:1px solid rgba(255,255,255,.1)}summary{font-size:12px;color:#a9adb5;cursor:pointer;list-style:none;padding:2px 0 4px}.control{display:grid;grid-template-columns:78px 1fr 45px;gap:8px;align-items:center;margin:8px 0;font-size:12px;color:#b9bdc5}.control output{text-align:right;color:#fff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#fff}.note{font-size:10.5px;line-height:1.45;color:#7f858f;padding:3px 0 1px}
</style>
</head>
<body>
<div id="app"><div id="stage">
<video id="video" autoplay playsinline muted></video><img id="photo" alt="선택한 사진">
<div id="empty"><div><h1>랜드마크까지<br>얼마나 멀까?</h1><p>GPS 없이 화면에 보이는 롯데월드타워의<br>겉보기 크기로 거리를 추정합니다.</p></div></div><div id="shade"></div>
<div class="top"><div class="brand">LANDMARK DISTANCE<small>LOTTE WORLD TOWER · 555 m</small></div><div class="badge">GPS OFF</div></div>
<div id="result"><div class="distanceLabel">롯데월드타워까지 약</div><div id="distance">—</div></div>
<div id="hint">가이드를 타워에 맞추세요 · 두 손가락으로 크기 조절</div>
<div id="towerWrap"><svg viewBox="0 0 112 520" xmlns="http://www.w3.org/2000/svg"><path class="solid" d="M56 4 C53 20 49 38 45 56 C41 77 38 101 35 128 C32 160 30 196 29 236 C28 278 28 318 27 352 L85 352 C84 318 84 278 83 236 C82 196 80 160 77 128 C74 101 71 77 67 56 C63 38 59 20 56 4 Z"/><path class="hidden" d="M27 352 C26 389 25 426 23 464 L20 512 M85 352 C86 389 87 426 89 464 L92 512 M20 512 L92 512"/><line class="cross" x1="44" y1="4" x2="68" y2="4"/><line class="cross" x1="16" y1="352" x2="96" y2="352"/></svg></div>
</div>
<div class="panel"><div class="row"><button class="btn primary" id="cameraBtn">카메라 시작</button><button class="btn" id="photoBtn">사진</button><button class="btn icon" id="resetBtn">↺</button><input id="fileInput" type="file" accept="image/*" capture="environment"></div>
<details><summary>정확도 보정 ▾</summary><label class="control">세로 화각<input id="fov" type="range" min="35" max="75" step="0.5" value="50"><output id="fovOut">50°</output></label><label class="control">가이드 크기<input id="scaleRange" type="range" min="0.05" max="1.8" step="0.005" value="0.35"><output id="scaleOut">35%</output></label><label class="control">기울기<input id="rotation" type="range" min="-15" max="15" step="0.5" value="0"><output id="rotationOut">0°</output></label><div class="note">개념 검증용입니다. 현재는 세로 화각 50°를 기본값으로 사용합니다.</div></details></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),stage=$('stage'),video=$('video'),photo=$('photo'),empty=$('empty'),tower=$('towerWrap'),result=$('result'),distanceEl=$('distance'),hint=$('hint'),cameraBtn=$('cameraBtn'),photoBtn=$('photoBtn'),resetBtn=$('resetBtn'),fileInput=$('fileInput'),fov=$('fov'),fovOut=$('fovOut'),scaleRange=$('scaleRange'),scaleOut=$('scaleOut'),rotation=$('rotation'),rotationOut=$('rotationOut');
const TOWER_HEIGHT_M=555,GUIDE_HEIGHT_PX=520;let x=innerWidth/2,y=innerHeight*.43,scale=.35,angle=0,stream=null;const pointers=new Map();let dragOffset=null,lastPinchDistance=0,lastMid=null;
function active(on=true){empty.classList.toggle('hidden',on);tower.classList.toggle('show',on);result.classList.toggle('show',on);hint.classList.toggle('show',on);if(on)setTimeout(()=>hint.classList.remove('show'),2500)}
function calc(){if(!tower.classList.contains('show'))return;const h=stage.clientHeight,vfov=Number(fov.value)*Math.PI/180,focal=h/(2*Math.tan(vfov/2)),projected=GUIDE_HEIGHT_PX*scale,d=TOWER_HEIGHT_M*focal/Math.max(1,projected);if(d>=1000){const km=d/1000;distanceEl.innerHTML=(km<10?km.toFixed(1):km.toFixed(0))+'<span>km</span>'}else distanceEl.innerHTML=(Math.round(d/10)*10)+'<span>m</span>'}
function render(){tower.style.left=x+'px';tower.style.top=y+'px';tower.style.transform=`translate(-50%,-50%) scale(${scale}) rotate(${angle}deg)`;scaleRange.value=scale;scaleOut.value=Math.round(scale*100)+'%';rotationOut.value=Number(angle).toFixed(angle%1?1:0)+'°';fovOut.value=Number(fov.value).toFixed(Number(fov.value)%1?1:0)+'°';calc()}
function reset(){x=stage.clientWidth/2;y=stage.clientHeight*.43;scale=.35;angle=0;scaleRange.value=scale;rotation.value=0;render()}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();photo.classList.remove('show');video.classList.add('show');cameraBtn.textContent='카메라 켜짐';active(true);reset()}catch(e){fileInput.click()}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;video.classList.remove('show');cameraBtn.textContent='카메라 시작'}
cameraBtn.onclick=startCamera;photoBtn.onclick=()=>fileInput.click();resetBtn.onclick=reset;
fileInput.onchange=()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;stopCamera();const url=URL.createObjectURL(file);photo.onload=()=>URL.revokeObjectURL(url);photo.src=url;photo.classList.add('show');active(true);reset()};
fov.oninput=render;scaleRange.oninput=()=>{scale=Number(scaleRange.value);render()};rotation.oninput=()=>{angle=Number(rotation.value);render()};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
stage.addEventListener('pointerdown',e=>{if(!tower.classList.contains('show'))return;stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)dragOffset={x:e.clientX-x,y:e.clientY-y};if(pointers.size===2){const [a,b]=[...pointers.values()];lastPinchDistance=dist(a,b);lastMid=mid(a,b);dragOffset=null}});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragOffset){x=e.clientX-dragOffset.x;y=e.clientY-dragOffset.y;render()}else if(pointers.size===2){const [a,b]=[...pointers.values()],d=dist(a,b),m=mid(a,b);if(lastPinchDistance>0){scale=Math.max(.05,Math.min(1.8,scale*(d/lastPinchDistance)));if(lastMid){x+=m.x-lastMid.x;y+=m.y-lastMid.y}}lastPinchDistance=d;lastMid=m;render()}});
function end(e){pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];dragOffset={x:p.x-x,y:p.y-y}}else dragOffset=null;if(pointers.size<2){lastPinchDistance=0;lastMid=null}}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);window.addEventListener('resize',render);render();
})();
</script></body></html>
