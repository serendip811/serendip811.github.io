<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#05070a" />
<title>Landmark Distance — Lotte World Tower</title>
<style>
  :root{color-scheme:dark;--panel:rgba(8,12,18,.80)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;color:#fff}
  button,input{font:inherit}
  #app{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#182333 0,#090d13 42%,#05070a 100%)}
  #stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none}
  #video,#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#111}
  #photo.show,#video.show{display:block}
  #shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.42),transparent 25%,transparent 68%,rgba(0,0,0,.68))}

  .topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .brand{font-weight:750;letter-spacing:-.035em;font-size:17px;text-shadow:0 1px 12px #000}
  .brand small{display:block;margin-top:3px;font-size:11px;font-weight:500;color:rgba(255,255,255,.66);letter-spacing:.02em}
  .badge{padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.34);backdrop-filter:blur(12px);font-size:11px;color:rgba(255,255,255,.76)}

  #empty{position:absolute;inset:0;display:grid;place-items:center;padding:36px;text-align:center;z-index:2}
  #empty.hidden{display:none}
  .emptyCard{max-width:330px;margin-top:-70px}
  .icon{width:74px;height:74px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:31px;box-shadow:0 18px 55px rgba(0,0,0,.3)}
  .emptyCard h1{font-size:27px;line-height:1.08;margin:0 0 10px;letter-spacing:-.045em}
  .emptyCard p{font-size:14px;line-height:1.55;margin:0;color:rgba(255,255,255,.62)}

  #result{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top) + 82px);z-index:25;display:none;pointer-events:none;text-align:center;text-shadow:0 2px 16px #000}
  #result.show{display:block}
  .distanceLabel{font-size:12px;color:rgba(255,255,255,.72);margin-bottom:3px}
  #distance{font-size:46px;font-weight:780;letter-spacing:-.055em;line-height:1}
  #distance span{font-size:18px;font-weight:650;letter-spacing:-.02em;margin-left:4px;color:rgba(255,255,255,.82)}
  #accuracy{margin-top:7px;font-size:10.5px;color:rgba(255,255,255,.56)}

  #towerWrap{position:absolute;width:112px;height:520px;left:50%;top:46%;transform:translate(-50%,-50%) scale(.35);transform-origin:50% 50%;z-index:8;display:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7));will-change:transform}
  #towerWrap.show{display:block}
  #towerVisible{position:absolute;inset:0;overflow:visible;will-change:clip-path}
  #towerVisible svg{width:100%;height:100%;overflow:visible}
  .guide{fill:rgba(255,255,255,.045);stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}
  .cross{stroke:rgba(255,255,255,.62);stroke-width:1.2;vector-effect:non-scaling-stroke}

  #occControls{position:absolute;inset:0;z-index:15;display:none;pointer-events:none}
  #occControls.show{display:block}
  #occBar{position:absolute;height:1px;background:rgba(255,255,255,.72);transform-origin:0 50%;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.28)}
  .occHandle{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.65);background:rgba(7,10,14,.72);backdrop-filter:blur(8px);pointer-events:auto;touch-action:none;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .occHandle::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
  #occLabel{position:absolute;transform:translate(-50%,-50%);padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);font-size:10.5px;color:rgba(255,255,255,.82);pointer-events:none;white-space:nowrap}

  #hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 148px);transform:translateX(-50%);z-index:26;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);border-radius:999px;padding:8px 12px;font-size:11px;color:rgba(255,255,255,.86);white-space:nowrap;display:none;pointer-events:none}
  #hint.show{display:block}

  .panel{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:40;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:10px;backdrop-filter:blur(24px) saturate(1.25);box-shadow:0 18px 55px rgba(0,0,0,.35)}
  .row{display:flex;gap:8px;align-items:center}
  .btn{height:48px;border:0;border-radius:16px;padding:0 16px;background:rgba(255,255,255,.1);color:#fff;font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn.primary{flex:1;background:#fff;color:#0b0d10}
  .btn.iconBtn{width:48px;padding:0;font-size:18px}
  #fileInput{display:none}
  details{margin-top:8px;border-top:1px solid rgba(255,255,255,.09);padding:8px 8px 0}
  summary{list-style:none;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer;padding:2px 0 5px}
  summary::-webkit-details-marker{display:none}
  .control{display:grid;grid-template-columns:78px 1fr 48px;gap:8px;align-items:center;margin:8px 0;font-size:12px;color:rgba(255,255,255,.68)}
  .control output{text-align:right;color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:#fff}
  .note{font-size:10.5px;line-height:1.45;color:rgba(255,255,255,.44);padding:3px 0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="선택한 사진" />
    <div id="empty">
      <div class="emptyCard">
        <div class="icon">⌁</div>
        <h1>랜드마크까지<br>얼마나 멀까?</h1>
        <p>GPS 없이, 화면에 보이는 롯데월드타워의 크기로 거리를 추정하는 실험입니다.</p>
      </div>
    </div>
    <div id="shade"></div>

    <div class="topbar">
      <div class="brand">LANDMARK DISTANCE<small>LOTTE WORLD TOWER · 555 m</small></div>
      <div class="badge">GPS OFF</div>
    </div>

    <div id="result">
      <div class="distanceLabel">롯데월드타워까지 약</div>
      <div id="distance">—</div>
      <div id="accuracy">1× 카메라 · 실험용 추정치</div>
    </div>

    <div id="hint">타워를 맞춘 뒤, 양쪽 ●을 실제 가려진 경계에 맞춰보세요</div>

    <div id="towerWrap" aria-label="롯데월드타워 맞춤 가이드">
      <div id="towerVisible">
        <svg viewBox="0 0 112 520" xmlns="http://www.w3.org/2000/svg">
          <path class="guide" d="M56 4 C53 20 49 38 45 56 C41 77 38 101 35 128 C32 160 30 196 29 236 C28 278 28 318 27 352 C26 389 25 426 23 464 L20 512 L92 512 L89 464 C87 426 86 389 85 352 C84 318 84 278 83 236 C82 196 80 160 77 128 C74 101 71 77 67 56 C63 38 59 20 56 4 Z"/>
          <line class="cross" x1="44" y1="4" x2="68" y2="4" />
        </svg>
      </div>
    </div>

    <div id="occControls">
      <div id="occBar"></div>
      <div id="occLeft" class="occHandle" data-side="left" aria-label="왼쪽 가림 경계"></div>
      <div id="occRight" class="occHandle" data-side="right" aria-label="오른쪽 가림 경계"></div>
      <div id="occLabel">가림 경계</div>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <button class="btn primary" id="cameraBtn">카메라 시작</button>
      <button class="btn" id="photoBtn">사진</button>
      <button class="btn iconBtn" id="resetBtn" aria-label="가이드 초기화">↺</button>
      <input id="fileInput" type="file" accept="image/*" capture="environment" />
    </div>
    <details>
      <summary>정확도 보정 ▾</summary>
      <label class="control">세로 화각<input id="fov" type="range" min="35" max="75" step="0.5" value="50"><output id="fovOut">50°</output></label>
      <label class="control">가이드 크기<input id="scale" type="range" min="0.05" max="1.8" step="0.005" value="0.35"><output id="scaleOut">35%</output></label>
      <label class="control">가림 높이<input id="occ" type="range" min="0.18" max="0.96" step="0.005" value="0.62"><output id="occOut">62%</output></label>
      <div class="note">사진마다 가려지는 높이가 다르므로 아래쪽을 고정하지 않습니다. 화면의 두 원을 각각 움직이면 비스듬한 가림도 맞출 수 있습니다.</div>
    </details>
  </div>
</div>
<script>
(() => {
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const photo = document.getElementById('photo');
  const empty = document.getElementById('empty');
  const tower = document.getElementById('towerWrap');
  const towerVisible = document.getElementById('towerVisible');
  const occControls = document.getElementById('occControls');
  const occBar = document.getElementById('occBar');
  const occLeft = document.getElementById('occLeft');
  const occRight = document.getElementById('occRight');
  const occLabel = document.getElementById('occLabel');
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');
  const distanceEl = document.getElementById('distance');
  const cameraBtn = document.getElementById('cameraBtn');
  const photoBtn = document.getElementById('photoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fileInput = document.getElementById('fileInput');
  const fov = document.getElementById('fov');
  const fovOut = document.getElementById('fovOut');
  const scaleRange = document.getElementById('scale');
  const scaleOut = document.getElementById('scaleOut');
  const occRange = document.getElementById('occ');
  const occOut = document.getElementById('occOut');

  const TOWER_HEIGHT_M = 555;
  const GUIDE_HEIGHT_PX = 520;

  let x = innerWidth / 2;
  let y = innerHeight * .46;
  let scale = .35;
  let occL = .62;
  let occR = .62;
  let stream = null;
  let activeOccSide = null;
  let dragOffset = null;
  let lastPinchDistance = 0;
  let lastPinchMid = null;
  const pointers = new Map();

  const clamp = (v,min,max) => Math.min(max,Math.max(min,v));
  const pointDistance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
  const midpoint = (a,b) => ({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

  function setMediaActive(active=true){
    empty.classList.toggle('hidden',active);
    tower.classList.toggle('show',active);
    occControls.classList.toggle('show',active);
    result.classList.toggle('show',active);
    hint.classList.toggle('show',active);
    if(active) setTimeout(()=>hint.classList.remove('show'),4200);
  }

  function resetGuide(){
    x = stage.clientWidth/2;
    y = stage.clientHeight*.46;
    scale = .35;
    occL = .62;
    occR = .62;
    scaleRange.value = scale;
    occRange.value = .62;
    render();
  }

  function updateDistance(){
    if(!tower.classList.contains('show')) return;
    const h = stage.clientHeight;
    const vfovRad = Number(fov.value)*Math.PI/180;
    const focalPx = h/(2*Math.tan(vfovRad/2));
    const projectedTowerHeight = GUIDE_HEIGHT_PX*scale;
    const distanceM = TOWER_HEIGHT_M*focalPx/Math.max(1,projectedTowerHeight);
    if(distanceM>=1000){
      const km = distanceM/1000;
      distanceEl.innerHTML = `${km<10?km.toFixed(1):Math.round(km)}<span>km</span>`;
    }else{
      distanceEl.innerHTML = `${Math.round(distanceM/10)*10}<span>m</span>`;
    }
  }

  function updateOcclusion(){
    const towerH = GUIDE_HEIGHT_PX*scale;
    const towerTop = y - towerH/2;
    const handleHalfWidth = Math.max(62,112*scale*.9);
    const x1 = x-handleHalfWidth;
    const x2 = x+handleHalfWidth;
    const y1 = towerTop+towerH*occL;
    const y2 = towerTop+towerH*occR;

    occLeft.style.left = x1+'px';
    occLeft.style.top = y1+'px';
    occRight.style.left = x2+'px';
    occRight.style.top = y2+'px';

    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy);
    const deg = Math.atan2(dy,dx)*180/Math.PI;
    occBar.style.left = x1+'px';
    occBar.style.top = y1+'px';
    occBar.style.width = len+'px';
    occBar.style.transform = `rotate(${deg}deg)`;
    occLabel.style.left = ((x1+x2)/2)+'px';
    occLabel.style.top = (((y1+y2)/2)-22)+'px';

    towerVisible.style.clipPath = `polygon(0 0,100% 0,100% ${occR*100}%,0 ${occL*100}%)`;
    occRange.value = (occL+occR)/2;
    occOut.value = Math.round(((occL+occR)/2)*100)+'%';
  }

  function render(){
    tower.style.left = x+'px';
    tower.style.top = y+'px';
    tower.style.transform = `translate(-50%,-50%) scale(${scale})`;
    scaleRange.value = scale;
    scaleOut.value = Math.round(scale*100)+'%';
    fovOut.value = Number(fov.value).toFixed(Number(fov.value)%1?1:0)+'°';
    updateOcclusion();
    updateDistance();
  }

  async function startCamera(){
    try{
      if(!navigator.mediaDevices?.getUserMedia) throw new Error('camera unsupported');
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream = await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
      video.srcObject = stream;
      await video.play();
      photo.classList.remove('show');
      video.classList.add('show');
      setMediaActive(true);
      cameraBtn.textContent = '카메라 켜짐';
      resetGuide();
    }catch(e){
      fileInput.click();
    }
  }

  function stopCamera(){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    video.srcObject=null;
    video.classList.remove('show');
    cameraBtn.textContent='카메라 시작';
  }

  cameraBtn.addEventListener('click',startCamera);
  photoBtn.addEventListener('click',()=>fileInput.click());
  resetBtn.addEventListener('click',resetGuide);

  fileInput.addEventListener('change',()=>{
    const file=fileInput.files?.[0];
    if(!file)return;
    stopCamera();
    const url=URL.createObjectURL(file);
    photo.onload=()=>URL.revokeObjectURL(url);
    photo.src=url;
    photo.classList.add('show');
    setMediaActive(true);
    resetGuide();
  });

  fov.addEventListener('input',render);
  scaleRange.addEventListener('input',()=>{scale=Number(scaleRange.value);render();});
  occRange.addEventListener('input',()=>{occL=occR=Number(occRange.value);render();});

  function beginOccDrag(e){
    e.preventDefault();
    e.stopPropagation();
    activeOccSide=e.currentTarget.dataset.side;
    e.currentTarget.setPointerCapture?.(e.pointerId);
  }
  occLeft.addEventListener('pointerdown',beginOccDrag);
  occRight.addEventListener('pointerdown',beginOccDrag);

  function moveOcc(e){
    if(!activeOccSide)return;
    const towerH=GUIDE_HEIGHT_PX*scale;
    const towerTop=y-towerH/2;
    const ratio=clamp((e.clientY-towerTop)/towerH,.18,.96);
    if(activeOccSide==='left')occL=ratio;else occR=ratio;
    render();
  }
  window.addEventListener('pointermove',moveOcc,{passive:false});
  window.addEventListener('pointerup',()=>{activeOccSide=null;});
  window.addEventListener('pointercancel',()=>{activeOccSide=null;});

  stage.addEventListener('pointerdown',e=>{
    if(!tower.classList.contains('show'))return;
    if(e.target.closest?.('.occHandle'))return;
    stage.setPointerCapture?.(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){
      dragOffset={x:e.clientX-x,y:e.clientY-y};
    }else if(pointers.size===2){
      const [a,b]=[...pointers.values()];
      lastPinchDistance=pointDistance(a,b);
      lastPinchMid=midpoint(a,b);
      dragOffset=null;
    }
  });

  stage.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)||activeOccSide)return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1&&dragOffset){
      x=e.clientX-dragOffset.x;
      y=e.clientY-dragOffset.y;
      render();
    }else if(pointers.size===2){
      const [a,b]=[...pointers.values()];
      const d=pointDistance(a,b);
      const mid=midpoint(a,b);
      if(lastPinchDistance>0){
        scale=clamp(scale*(d/lastPinchDistance),.05,1.8);
      }
      if(lastPinchMid){
        x+=mid.x-lastPinchMid.x;
        y+=mid.y-lastPinchMid.y;
      }
      lastPinchDistance=d;
      lastPinchMid=mid;
      render();
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size===0){dragOffset=null;lastPinchDistance=0;lastPinchMid=null;}
    else if(pointers.size===1){
      const p=[...pointers.values()][0];
      dragOffset={x:p.x-x,y:p.y-y};
      lastPinchDistance=0;
      lastPinchMid=null;
    }
  }
  stage.addEventListener('pointerup',endPointer);
  stage.addEventListener('pointercancel',endPointer);

  window.addEventListener('resize',()=>{
    x=clamp(x,0,stage.clientWidth);
    y=clamp(y,0,stage.clientHeight);
    render();
  });

  render();
})();
</script>
</body>
</html>
