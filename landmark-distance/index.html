<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#000" />
<meta name="description" content="카메라를 비추면 서울의 랜드마크·산·쇼핑몰 방향과 거리를 보여주는 실험형 웹 AR 지도." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Landmark Finder — Seoul</title>
<style>
:root{color-scheme:dark;--glass:rgba(8,11,16,.58);--line:rgba(255,255,255,.18);--muted:rgba(255,255,255,.68)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;color:#fff}
button{font:inherit}
#app,#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 24%,transparent 70%,rgba(0,0,0,.68))}
.topbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:13px;font-weight:760;letter-spacing:-.025em;text-shadow:0 2px 12px #000}.brand small{display:block;margin-top:3px;font-size:9px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.gps{font-size:9px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);color:var(--muted)}
#info{position:absolute;top:calc(env(safe-area-inset-top) + 66px);left:50%;transform:translateX(-50%);z-index:22;text-align:center;white-space:nowrap;text-shadow:0 2px 14px #000;pointer-events:none}
#targetName{font-size:10px;color:rgba(255,255,255,.74);margin-bottom:2px}#distance{font-size:32px;font-weight:780;letter-spacing:-.05em;line-height:1}#distance span{font-size:14px;margin-left:3px;color:rgba(255,255,255,.8)}#meta{margin-top:5px;font-size:10px;color:rgba(255,255,255,.62)}
.marker{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);z-index:12;display:none;pointer-events:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.75))}.marker.show{display:block}.marker svg{width:100%;height:100%;overflow:visible}.tower{fill:rgba(255,255,255,.035);stroke:#fff;stroke-width:2.2;vector-effect:non-scaling-stroke}.centerline{stroke:rgba(255,255,255,.34);stroke-width:1;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.markerLabel{position:absolute;left:50%;top:-28px;transform:translateX(-50%);font-size:10px;font-weight:650;padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.56);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);white-space:nowrap}.marker.selected .tower{stroke-width:3}.marker.selected .markerLabel{background:rgba(255,255,255,.94);color:#0b0d10}
.poiMarker{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);z-index:14;display:none;pointer-events:none;text-align:center;filter:drop-shadow(0 2px 10px rgba(0,0,0,.75))}.poiMarker.show{display:block}.poiSymbol{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:auto;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);font-size:15px;font-weight:800}.poiMarker.selected .poiSymbol{background:#fff;color:#0b0d10}.poiLabel{margin-top:5px;font-size:10px;font-weight:650;padding:4px 7px;border-radius:999px;background:rgba(0,0,0,.54);border:1px solid rgba(255,255,255,.14);white-space:nowrap}.poiDistance{opacity:.65;font-weight:500}
.edgeStack{position:absolute;top:32%;z-index:20;display:flex;flex-direction:column;gap:7px;pointer-events:auto;max-width:46%}.edgeStack.left{left:10px;align-items:flex-start}.edgeStack.right{right:10px;align-items:flex-end}.edgePill{border:1px solid var(--line);background:rgba(0,0,0,.52);backdrop-filter:blur(12px);color:#fff;border-radius:999px;height:30px;padding:0 10px;font-size:10px;font-weight:650;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.edgePill.selected{background:#fff;color:#0b0d10;border-color:#fff}.edgePill .d{opacity:.58;font-weight:500;margin-left:4px}
#selectorWrap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:26}.filterBar{display:flex;justify-content:center;gap:5px;margin-bottom:7px}.filterBtn{height:26px;border-radius:999px;border:1px solid var(--line);background:rgba(7,10,14,.58);color:rgba(255,255,255,.7);padding:0 9px;font-size:9px;font-weight:700;backdrop-filter:blur(12px)}.filterBtn.active{background:#fff;color:#0b0d10;border-color:#fff}
#selector{display:flex;gap:6px;overflow-x:auto;padding:0 12px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}#selector::-webkit-scrollbar{display:none}.chip{flex:none;height:32px;border:1px solid var(--line);border-radius:999px;background:rgba(7,10,14,.6);backdrop-filter:blur(14px);color:rgba(255,255,255,.74);padding:0 11px;font-size:10px;font-weight:650}.chip.active{background:#fff;color:#0b0d10;border-color:#fff}
#status{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 145px);transform:translateX(-50%);z-index:22;max-width:84%;padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.42);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:9.5px;color:rgba(255,255,255,.68);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#start{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);height:56px;border:0;border-radius:20px;background:#fff;color:#0b0d10;font-size:16px;font-weight:750;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.32)}#start.running{width:50px;left:auto;border-radius:50%;font-size:18px;background:rgba(9,12,17,.66);color:#fff;border:1px solid var(--line);backdrop-filter:blur(16px)}
#privacy{position:absolute;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:28;text-align:center;font-size:10px;line-height:1.45;color:rgba(255,255,255,.58);text-shadow:0 1px 8px #000;pointer-events:none}#privacy.hidden{display:none}
#calibrationToast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 118px);transform:translateX(-50%);z-index:35;display:none;padding:8px 11px;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:10px;white-space:nowrap}#calibrationToast.show{display:block}
.markerLabel::after,.poiLabel::after{content:" · 예상";opacity:.5;font-weight:500}
</style>
</head>
<body>
<div id="app"><div id="stage">
<video id="video" autoplay playsinline muted></video><div id="shade"></div>
<div class="topbar"><div class="brand">LANDMARK FINDER<small>SEOUL · GPS + COMPASS</small></div><div class="gps" id="gpsBadge">GPS WAIT</div></div>
<div id="info"><div id="targetName">랜드마크 선택</div><div id="distance">—</div><div id="meta">현재 위치를 확인하는 중</div></div>
<div id="markers"></div><div id="edgeLeft" class="edgeStack left"></div><div id="edgeRight" class="edgeStack right"></div>
<div id="status">시작을 눌러 위치와 방향 권한을 허용하세요</div><div id="calibrationToast">방향을 보정했어요</div>
<div id="selectorWrap"><div class="filterBar"><button class="filterBtn active" data-filter="all">전체</button><button class="filterBtn" data-filter="building">건물</button><button class="filterBtn" data-filter="mountain">산</button><button class="filterBtn" data-filter="mall">쇼핑</button></div><div id="selector"></div></div>
<div id="privacy">카메라·위치·방향 정보는 이 기기에서만 계산하며 서버로 전송하지 않습니다.<br>표시는 센서 상태에 따라 실제 위치와 차이가 날 수 있습니다.</div><button id="start">랜드마크 찾기 시작</button>
</div></div>
<script>
(()=>{
const LANDMARKS=[
{id:'lotte',name:'롯데월드타워',short:'롯데타워',lat:37.5125,lng:127.1025,height:555,type:'building',shape:'lotte'},
{id:'nseoul',name:'N서울타워',short:'N서울타워',lat:37.5512,lng:126.9882,height:237,type:'building',shape:'needle'},
{id:'63',name:'63스퀘어',short:'63빌딩',lat:37.5198,lng:126.9401,height:249,type:'building',shape:'block'},
{id:'trade',name:'트레이드타워',short:'트레이드타워',lat:37.5104,lng:127.0600,height:228,type:'building',shape:'block'},
{id:'parc1',name:'파크원 타워1',short:'파크원',lat:37.5253,lng:126.9284,height:333,type:'building',shape:'block'},
{id:'baegun',name:'북한산 백운대',short:'백운대',lat:37.65863,lng:126.97800,elevation:836,type:'mountain'},
{id:'gwanak',name:'관악산',short:'관악산',lat:37.44514,lng:126.96424,elevation:632,type:'mountain'},
{id:'dobong',name:'도봉산',short:'도봉산',lat:37.70095,lng:127.01551,elevation:739.5,type:'mountain'},
{id:'inwang',name:'인왕산',short:'인왕산',lat:37.58505,lng:126.95931,elevation:338,type:'mountain'},
{id:'namsan',name:'남산',short:'남산',lat:37.55571,lng:126.99225,elevation:270,type:'mountain'},
{id:'coex',name:'스타필드 코엑스몰',short:'코엑스몰',lat:37.51192,lng:127.05922,type:'mall'},
{id:'hyundai',name:'더현대 서울',short:'더현대서울',lat:37.52520,lng:126.92911,type:'mall'},
{id:'times',name:'타임스퀘어',short:'타임스퀘어',lat:37.51783,lng:126.90538,type:'mall'},
{id:'lwmall',name:'롯데월드몰',short:'롯데월드몰',lat:37.51417,lng:127.10407,type:'mall'}
];
const HFOV=62,VFOV=50;
const $=id=>document.getElementById(id),video=$('video'),start=$('start'),markersEl=$('markers'),selector=$('selector'),targetName=$('targetName'),distanceEl=$('distance'),meta=$('meta'),status=$('status'),gpsBadge=$('gpsBadge'),edgeLeft=$('edgeLeft'),edgeRight=$('edgeRight'),privacy=$('privacy'),calibrationToast=$('calibrationToast');
let pos=null,heading=null,pitch=0,rawHeading=null,rawPitch=null,headingOffset=0,stream=null,watchId=null,running=false,selectedId='lotte',filter='all';
const markerEls=new Map();
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,wrap=a=>((a+540)%360)-180,km=m=>m>=1000?(m/1000<10?(m/1000).toFixed(1):Math.round(m/1000))+'km':Math.round(m/10)*10+'m';
function smoothAngle(prev,next,a=.18){if(prev==null)return next;return (prev+wrap(next-prev)*a+360)%360}
function smoothValue(prev,next,a=.16){return prev==null?next:prev+(next-prev)*a}
function showToast(msg){calibrationToast.textContent=msg;calibrationToast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>calibrationToast.classList.remove('show'),1800)}
function haversine(a,b){const R=6371000,p1=rad(a.lat),p2=rad(b.lat),dp=rad(b.lat-a.lat),dl=rad(b.lng-a.lng);const q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function bearing(a,b){const p1=rad(a.lat),p2=rad(b.lat),dl=rad(b.lng-a.lng);const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (deg(Math.atan2(y,x))+360)%360}
function fmtDistance(m){return m>=1000?`${m/1000<10?(m/1000).toFixed(1):Math.round(m/1000)}<span>km</span>`:`${Math.round(m/10)*10}<span>m</span>`}
function shapeSVG(shape){if(shape==='needle')return '<svg viewBox="0 0 100 360"><line class="tower" x1="50" y1="2" x2="50" y2="354"/><path class="tower" d="M43 118 L57 118 L64 142 L36 142 Z"/><path class="tower" d="M39 142 L61 142 L67 169 L33 169 Z"/><line class="centerline" x1="50" y1="2" x2="50" y2="354"/></svg>';if(shape==='block')return '<svg viewBox="0 0 100 360"><path class="tower" d="M30 8 L70 8 L78 354 L22 354 Z"/><line class="centerline" x1="50" y1="8" x2="50" y2="354"/></svg>';return '<svg viewBox="0 0 100 360"><path class="tower" d="M50 3 C47 16 43 32 39 50 C35 72 32 96 29 122 C26 151 24 184 23 220 C22 255 21 294 18 354 L82 354 C79 294 78 255 77 220 C76 184 74 151 71 122 C68 96 65 72 61 50 C57 32 53 16 50 3 Z"/><line class="centerline" x1="50" y1="3" x2="50" y2="354"/></svg>'}
function typeSymbol(type){return type==='mountain'?'△':type==='mall'?'●':'◇'}
function matches(l){return filter==='all'||l.type===filter}
function buildUI(){
 LANDMARKS.forEach(l=>{let m=document.createElement('div');if(l.type==='building'){m.className='marker';m.innerHTML=`<div class="markerLabel">${l.short}</div>${shapeSVG(l.shape)}`}else{m.className='poiMarker';m.innerHTML=`<div class="poiSymbol">${typeSymbol(l.type)}</div><div class="poiLabel">${l.short} <span class="poiDistance"></span></div>`}m.dataset.id=l.id;markersEl.appendChild(m);markerEls.set(l.id,m)});
 document.querySelectorAll('.filterBtn').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filterBtn').forEach(x=>x.classList.toggle('active',x===b));const current=LANDMARKS.find(l=>l.id===selectedId);if(current&&!matches(current)){const first=LANDMARKS.find(matches);if(first)selectedId=first.id}rebuildSelector();update()}));
 rebuildSelector();
}
function rebuildSelector(){selector.innerHTML='';LANDMARKS.filter(matches).forEach(l=>{const b=document.createElement('button');b.className='chip'+(l.id===selectedId?' active':'');b.dataset.id=l.id;b.textContent=`${typeSymbol(l.type)} ${l.short}`;b.addEventListener('click',()=>select(l.id));selector.appendChild(b)})}
function select(id){selectedId=id;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.id===id));update()}
function updateEdges(items){edgeLeft.innerHTML='';edgeRight.innerHTML='';for(const side of ['left','right']){const target=side==='left'?edgeLeft:edgeRight;items.filter(x=>x.side===side).sort((a,b)=>{if(a.l.id===selectedId)return -1;if(b.l.id===selectedId)return 1;return Math.abs(a.delta)-Math.abs(b.delta)}).slice(0,3).forEach(x=>{const b=document.createElement('button');b.className='edgePill'+(x.l.id===selectedId?' selected':'');b.innerHTML=`${side==='left'?'← ':''}${typeSymbol(x.l.type)} ${x.l.short}<span class="d">${km(x.d)}</span>${side==='right'?' →':''}`;b.addEventListener('click',()=>select(x.l.id));target.appendChild(b)})}}
function update(){
 markerEls.forEach(m=>m.classList.remove('show'));edgeLeft.innerHTML='';edgeRight.innerHTML='';
 if(!pos)return;
 const selected=LANDMARKS.find(l=>l.id===selectedId)||LANDMARKS[0],sd=haversine(pos,selected),sb=bearing(pos,selected);targetName.textContent=`${typeSymbol(selected.type)} ${selected.name}`;distanceEl.innerHTML=fmtDistance(sd);meta.textContent=`방위 ${Math.round(sb)}° · GPS ±${Math.round(pos.accuracy||0)}m · 예상 위치`;gpsBadge.textContent='GPS ON';
 if(heading==null){status.textContent='방향 센서 대기 중 · 휴대폰을 움직여 보세요';return}
 let visibleCount=0;const off=[];
 for(const l of LANDMARKS.filter(matches)){
  const m=markerEls.get(l.id),d=haversine(pos,l),b=bearing(pos,l),delta=wrap(b-heading);m.classList.toggle('selected',l.id===selectedId);
  if(Math.abs(delta)<=HFOV/2){visibleCount++;m.classList.add('show');const x=50+(delta/HFOV)*100;const pitchShift=Math.max(-innerHeight*.25,Math.min(innerHeight*.25,(pitch-80)*6));m.style.left=x+'%';m.style.top=`calc(51% + ${pitchShift}px)`;
   if(l.type==='building'){const angular=deg(2*Math.atan((l.height/2)/Math.max(d,1))),h=Math.max(10,Math.min(innerHeight*.66,angular*(innerHeight/VFOV))),w=Math.max(6,h*(100/360));m.style.width=w+'px';m.style.height=h+'px'}else{m.style.width='auto';m.style.height='auto';const pd=m.querySelector('.poiDistance');if(pd)pd.textContent=km(d)}
  }else off.push({l,d,delta,side:delta<0?'left':'right'})
 }
 updateEdges(off);
 const sdelta=wrap(sb-heading);if(Math.abs(sdelta)<=HFOV/2){status.textContent=selected.type==='building'?`현재 방향과 일치 · 건물은 예상 크기 표시`:`현재 방향과 일치 · ${selected.type==='mountain'?'산은 정상 방향 중심':'쇼핑몰은 위치 방향 중심'}`}else status.textContent=`${sdelta>0?'오른쪽':'왼쪽'} ${Math.round(Math.abs(sdelta))}° · 가장자리 표시를 따라 돌려보세요`;
}
function onOrientation(e){let h=null;if(typeof e.webkitCompassHeading==='number'&&e.webkitCompassAccuracy>=0)h=e.webkitCompassHeading;else if(typeof e.alpha==='number')h=(360-e.alpha)%360;if(h!=null){rawHeading=h;rawPitch=typeof e.beta==='number'?e.beta:0;const corrected=(rawHeading+headingOffset+360)%360;heading=smoothAngle(heading,corrected);pitch=smoothValue(pitch,rawPitch);update()}}
async function requestOrientation(){try{if(typeof DeviceOrientationEvent==='undefined')throw new Error('이 기기에서는 방향 센서를 사용할 수 없습니다');if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw new Error('방향 권한이 거부되었습니다')}window.addEventListener('deviceorientation',onOrientation,true);return true}catch(e){status.textContent=e.message||'방향 센서 권한이 필요합니다';return false}}
function startGPS(){if(!navigator.geolocation){status.textContent='이 브라우저는 위치 기능을 지원하지 않습니다';return}if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};update()},e=>{gpsBadge.textContent='GPS ERROR';status.textContent=e.code===1?'위치 권한을 허용해주세요':'현재 위치를 가져오지 못했습니다'},{enableHighAccuracy:true,maximumAge:1000,timeout:12000})}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('카메라를 사용할 수 없는 브라우저입니다');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();return true}catch(e){status.textContent=e.name==='NotAllowedError'?'카메라 권한을 허용해주세요':(e.message||'카메라를 시작하지 못했습니다');return false}}
start.addEventListener('click',async()=>{if(!running){if(!window.isSecureContext){status.textContent='HTTPS 환경에서 열어주세요';return}running=true;start.textContent='◎';start.setAttribute('aria-label','선택한 랜드마크 방향으로 보정');start.classList.add('running');privacy.classList.add('hidden');status.textContent='권한 요청 중…';await requestOrientation();startGPS();await startCamera();status.textContent='휴대폰을 천천히 돌려 주변 랜드마크를 찾아보세요'}else{if(!pos||rawHeading==null){showToast('위치·방향 정보를 기다리는 중이에요');return}const selected=LANDMARKS.find(l=>l.id===selectedId);if(!selected)return;const targetBearing=bearing(pos,selected);headingOffset=wrap(targetBearing-rawHeading);heading=(rawHeading+headingOffset+360)%360;showToast(`${selected.short} 기준으로 방향 보정`);update()}});
window.addEventListener('resize',update);window.addEventListener('pagehide',()=>{if(watchId!=null)navigator.geolocation.clearWatch(watchId);if(stream)stream.getTracks().forEach(t=>t.stop())});buildUI();update();
})();
</script>
</body>
</html>
